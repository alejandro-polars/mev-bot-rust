[package]
name = "mev-bot-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Blockchain & Web3
ethers = { version = "2.0", features = ["full"] }
tokio = { version = "1", features = ["full"] }

# Data structures & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async utilities
futures = "0.3"
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
dotenv = "0.15"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
once_cell = "1.19"

# Time handling
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
